<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Eucalyn Trainer 自動テスト</title>
  <style>
    :root { color-scheme: light; font-family: "Yu Gothic UI", "Yu Gothic", sans-serif; }
    body { max-width: 820px; margin: 0 auto; padding: 36px 20px; color: #242a2e; background: #f7f8f8; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #687178; }
    #summary { margin: 24px 0; padding: 16px 18px; border-radius: 10px; background: #fff; border: 1px solid #dfe3e5; font-weight: 700; }
    #summary.pass { color: #157a52; border-color: #b9dfd0; background: #edf9f4; }
    #summary.fail { color: #ad302d; border-color: #efc4c2; background: #fff2f1; }
    ol { padding: 0; list-style: none; display: grid; gap: 8px; }
    li { padding: 12px 14px; border: 1px solid #dfe3e5; border-radius: 8px; background: #fff; }
    li::before { display: inline-block; width: 2.2em; font-weight: 700; }
    li.pass::before { content: "PASS"; color: #16825a; }
    li.fail::before { content: "FAIL"; color: #c13b37; }
    li small { display: block; margin: 5px 0 0 2.6em; color: #ad302d; }
    #fixture { position: fixed; left: -3000px; top: 0; width: 1280px; height: 800px; border: 0; visibility: hidden; }
  </style>
</head>
<body>
  <h1>Eucalyn Trainer 自動テスト</h1>
  <p>実際の <code>index.html</code> を読み込み、キーボード操作と画面状態を検証します。</p>
  <div id="summary" role="status" aria-live="polite">テスト実行中…</div>
  <ol id="results"></ol>
  <iframe id="fixture" title="テスト対象"></iframe>

  <script>
    (() => {
      "use strict";

      const TESTS = [];
      const results = [];
      const fixture = document.querySelector("#fixture");
      const RUN_ID = Date.now().toString(36);
      let nonce = 0;

      function test(name, run) { TESTS.push({ name, run }); }

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function equal(actual, expected, label) {
        if (actual !== expected) {
          throw new Error(`${label}: 期待値「${expected}」、実際「${actual}」`);
        }
      }

      async function loadApp(width = 1280, height = 800, testId = null) {
        fixture.style.width = `${width}px`;
        fixture.style.height = `${height}px`;
        const loaded = new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error("index.html の読み込みがタイムアウトしました")), 3000);
          fixture.onload = () => { clearTimeout(timeout); resolve(); };
        });
        const id = `${RUN_ID}-${testId || ++nonce}`;
        fixture.src = `../index.html?test=${encodeURIComponent(id)}&load=${++nonce}`;
        await loaded;
        return { win: fixture.contentWindow, doc: fixture.contentDocument };
      }

      function press(win, key, extra = {}) {
        win.dispatchEvent(new win.KeyboardEvent("keydown", {
          key,
          bubbles: true,
          cancelable: true,
          ...extra
        }));
      }

      function activeKey(doc) {
        return doc.querySelector(".key.next")?.dataset.value;
      }

      function selectPlatform(win, doc, value) {
        const select = doc.querySelector("#platformSelect");
        select.value = value;
        select.dispatchEvent(new win.Event("change", { bubbles: true }));
      }

      function selectCourse(doc, course) {
        doc.querySelector(`[data-course="${course}"]`).click();
      }

      test("テンキーを表示せず文字キーを5段で表示する", async () => {
        const { doc } = await loadApp();
        equal(doc.querySelectorAll("#mainKeys .key-row").length, 5, "キーボードの段数");
        assert(!doc.querySelector("#numpad, .numpad"), "テンキーが残っています");
        assert(!doc.body.textContent.includes("Num Lock"), "Num Lockが表示されています");
      });

      test("OSを自動判定して修飾キーを表示する", async () => {
        const { win, doc } = await loadApp();
        const source = win.navigator.userAgentData?.platform || win.navigator.platform || win.navigator.userAgent || "";
        const expected = /mac/i.test(source) ? "mac" : "windows";
        equal(doc.body.dataset.platformPreference, "auto", "初期設定");
        equal(doc.body.dataset.platform, expected, "自動判定結果");
      });

      test("WindowsとMacの表示切替を保存する", async () => {
        let app = await loadApp();
        selectPlatform(app.win, app.doc, "windows");
        equal(app.doc.body.dataset.platform, "windows", "Windows切替");
        assert([...app.doc.querySelectorAll("#mainKeys .key-row:last-child .key")].some(key => key.textContent === "Win"), "Winキーがありません");

        selectPlatform(app.win, app.doc, "mac");
        equal(app.doc.body.dataset.platform, "mac", "Mac切替");
        assert([...app.doc.querySelectorAll("#mainKeys .key-row:last-child .key")].some(key => key.textContent === "command"), "commandキーがありません");

        app = await loadApp();
        equal(app.doc.body.dataset.platformPreference, "mac", "保存された設定");
        equal(app.doc.body.dataset.platform, "mac", "再読み込み後の表示");
        selectPlatform(app.win, app.doc, "auto");
      });

      test("WindowsとMacのショートカット入力を奪わない", async () => {
        const { win, doc } = await loadApp();
        const ctrlEvent = new win.KeyboardEvent("keydown", { key: "c", ctrlKey: true, cancelable: true });
        const commandEvent = new win.KeyboardEvent("keydown", { key: "c", metaKey: true, cancelable: true });
        win.dispatchEvent(ctrlEvent);
        win.dispatchEvent(commandEvent);
        assert(!ctrlEvent.defaultPrevented, "Ctrlショートカットが抑止されました");
        assert(!commandEvent.defaultPrevented, "Commandショートカットが抑止されました");
        equal(doc.querySelector("#typedCount").textContent, "0", "ショートカット後の入力文字数");
      });

      test("初期状態はスペースキーと両親指を案内する", async () => {
        const { doc } = await loadApp();
        assert(doc.querySelector("#lesson").classList.contains("waiting"), "待機状態ではありません");
        equal(doc.querySelector("#typedCount").textContent, "0", "入力文字数");
        equal(activeKey(doc), " ", "案内キー");
        equal(doc.querySelectorAll(".finger.active").length, 2, "点灯する親指の数");
        equal(doc.querySelector("#fingerName").textContent, "両親指", "担当指表示");
      });

      test("スペースキーで練習を開始し、最初の文字と指を案内する", async () => {
        const { win, doc } = await loadApp();
        press(win, " ");
        assert(doc.querySelector("#lesson").classList.contains("running"), "練習が開始されていません");
        equal(doc.querySelector("#jpText").textContent, "A キー", "最初のキー課題");
        equal(doc.querySelector(".romaji .current").textContent, "A", "最初の文字");
        equal(activeKey(doc), "A", "最初の案内キー");
        equal(doc.querySelector("#fingerName").textContent, "左小指", "最初の担当指");
      });

      test("初心者コースではWPMを隠して反復回数を表示する", async () => {
        const { doc } = await loadApp();
        assert(doc.querySelector("#wpmStat").hidden, "WPMが表示されています");
        assert(!doc.querySelector("#streakStat").hidden, "連続成功が非表示です");
        equal(doc.querySelector("#streak").textContent, "0 / 3", "初期の連続成功");
        equal(doc.querySelector("#remaining").textContent, "3回", "初期の残り回数");
      });

      test("キー課題を3回連続で正しく入力すると完了する", async () => {
        const { win, doc } = await loadApp();
        press(win, " ");
        press(win, "a");
        equal(doc.querySelector("#streak").textContent, "1 / 3", "1回目の成功");
        press(win, "a");
        equal(doc.querySelector("#streak").textContent, "2 / 3", "2回目の成功");
        press(win, "a");
        assert(doc.querySelector("#lesson").classList.contains("complete"), "3回成功後に完了していません");
        equal(doc.querySelector("#streak").textContent, "3 / 3", "完了時の連続成功");
        equal(doc.querySelector("#typedCount").textContent, "3", "完了時の入力文字数");
      });

      test("誤入力すると連続成功回数をリセットする", async () => {
        const { win, doc } = await loadApp();
        press(win, " ");
        press(win, "a");
        equal(doc.querySelector("#streak").textContent, "1 / 3", "誤入力前の連続成功");
        press(win, "q");
        equal(doc.querySelector("#streak").textContent, "0 / 3", "誤入力後の連続成功");
        equal(doc.querySelector("#remaining").textContent, "3回", "誤入力後の残り回数");
      });

      test("短いワードへ手動で切り替えて反復できる", async () => {
        const { win, doc } = await loadApp();
        selectCourse(doc, "words");
        press(win, " ");
        equal(doc.querySelector("#jpText").textContent, "愛", "最初の短いワード");
        equal(doc.querySelector("#romajiText").textContent, "AI", "短いワードのローマ字");
        [..."AIAIAI"].forEach(char => press(win, char));
        assert(doc.querySelector("#lesson").classList.contains("complete"), "短いワードが完了していません");
        equal(doc.querySelector("#streak").textContent, "3 / 3", "短いワードの連続成功");
      });

      test("今日の5分ボタンでガイド付きセッションを開始する", async () => {
        const { win, doc } = await loadApp();
        doc.querySelector("#sessionStart").click();
        const session = win.__EUCALYN_TEST__.getSessionState();
        assert(session.active, "5分セッションが開始されていません");
        equal(session.duration, 300000, "セッション時間");
        equal(doc.querySelector("#sessionPhase").textContent, "前回の復習", "最初の区間");
        assert(!doc.querySelector("#sessionHud").hidden, "セッション表示が隠れています");
        assert([...doc.querySelectorAll("[data-course]")].every(button => button.disabled), "セッション中にコースが操作できます");
      });

      test("経過時間に応じて短いワードと振り返りへ切り替わる", async () => {
        const { win, doc } = await loadApp();
        doc.querySelector("#sessionStart").click();
        win.__EUCALYN_TEST__.advanceSession(61000);
        equal(doc.querySelector("#sessionPhase").textContent, "短いワード", "2番目の区間");
        assert(doc.querySelector('[data-course="words"]').getAttribute("aria-pressed") === "true", "短いワードへ切り替わっていません");
        win.__EUCALYN_TEST__.advanceSession(180000);
        equal(doc.querySelector("#sessionPhase").textContent, "振り返り", "振り返り区間");
        assert(doc.querySelector("#lesson").classList.contains("session-summary"), "振り返り画面ではありません");
        assert(win.__EUCALYN_TEST__.getSessionState().active, "5分前に終了しています");
      });

      test("5分終了後に完了表示と任意延長を利用できる", async () => {
        const { win, doc } = await loadApp();
        doc.querySelector("#sessionStart").click();
        win.__EUCALYN_TEST__.advanceSession(300001);
        assert(doc.querySelector("#lesson").classList.contains("session-finished"), "5分完了画面ではありません");
        assert(!win.__EUCALYN_TEST__.getSessionState().active, "セッションが終了していません");
        assert(doc.querySelector(".statusbar").hidden, "課題単位のステータスが残っています");
        assert(win.getComputedStyle(doc.querySelector("#extendSession")).display !== "none", "延長ボタンが表示されていません");
        doc.querySelector("#extendSession").click();
        assert(win.__EUCALYN_TEST__.getSessionState().active, "延長セッションが開始されていません");
      });

      test("中断しても失敗表示を出さず待機状態へ戻る", async () => {
        const { win, doc } = await loadApp();
        doc.querySelector("#sessionStart").click();
        doc.querySelector("#stopSession").click();
        assert(!win.__EUCALYN_TEST__.getSessionState().active, "中断後もセッションが動いています");
        assert(doc.querySelector("#lesson").classList.contains("waiting"), "待機状態へ戻っていません");
        assert(doc.querySelector("#startMessage").textContent.includes("いつでも再開"), "再開案内がありません");
        assert(!doc.body.textContent.includes("失敗しました"), "失敗表示が出ています");
        assert([...doc.querySelectorAll("[data-course]")].every(button => !button.disabled), "コース選択が戻っていません");
      });

      test("キー習得条件を満たすと短いワードをおすすめする", async () => {
        const { win, doc } = await loadApp();
        win.__EUCALYN_TEST__.seedKeyMastery();
        assert(doc.querySelector("#stageStatus").textContent.includes("短いワード"), "おすすめ段階が更新されていません");
        assert([...doc.querySelectorAll("[data-course]")].every(button => !button.disabled), "条件未達コースの手動選択が制限されています");
        doc.querySelector("#sessionStart").click();
        assert(doc.querySelector('[data-course="words"]').getAttribute("aria-pressed") === "true", "おすすめ段階から5分練習が始まりません");
      });

      test("入力履歴と混同キーを再読み込み後も保持する", async () => {
        let app = await loadApp(1280, 800, "progress-persistence");
        app.win.localStorage.removeItem(app.win.__EUCALYN_TEST__.getProgressSummary().storageKey);
        app = await loadApp(1280, 800, "progress-persistence");
        press(app.win, " ");
        press(app.win, "q");
        press(app.win, "q");
        press(app.win, "q");
        let summary = app.win.__EUCALYN_TEST__.getProgressSummary();
        equal(summary.attemptCount, 3, "保存前の入力履歴数");
        equal(summary.weakKeys[0].key, "A", "弱点キー");
        equal(summary.weakKeys[0].confusedWith, "Q", "混同先キー");
        assert(app.doc.querySelector("#weaknessSummary").textContent.includes("A→Q"), "弱点表示が更新されていません");

        app = await loadApp(1280, 800, "progress-persistence");
        summary = app.win.__EUCALYN_TEST__.getProgressSummary();
        equal(summary.attemptCount, 3, "再読み込み後の入力履歴数");
        equal(summary.weakKeys[0].confusionCount, 3, "再読み込み後の混同回数");
      });

      test("反応の遅いキーと苦手な2文字連鎖を分析する", async () => {
        const { win } = await loadApp();
        const attempts = [];
        for (let i = 0; i < 5; i += 1) attempts.push({ expected: "A", typed: "A", correct: true, latencyMs: 100 });
        for (let i = 0; i < 5; i += 1) attempts.push({ expected: "E", typed: "E", correct: true, latencyMs: 1000 });
        for (let i = 0; i < 5; i += 1) attempts.push({ expected: "I", typed: i < 3 ? "Q" : "I", correct: i >= 3, latencyMs: 200, context: "A" });
        win.__EUCALYN_TEST__.seedAttempts(attempts);
        const summary = win.__EUCALYN_TEST__.getProgressSummary();
        const slowKey = summary.weakKeys.find(item => item.key === "E");
        assert(slowKey?.reasons.includes("反応時間"), "反応の遅いEが検出されていません");
        assert(summary.weakSequences.some(item => item.sequence === "AI"), "苦手な2文字連鎖AIが検出されていません");
      });

      test("適応メニューを弱点60%・現在25%・復習15%で構成する", async () => {
        const { win } = await loadApp();
        const attempts = [];
        ["A", "I", "U", "O"].forEach(expected => {
          for (let i = 0; i < 3; i += 1) attempts.push({ expected, typed: "Q", correct: false, latencyMs: 200 });
        });
        win.__EUCALYN_TEST__.seedAttempts(attempts);
        const menu = win.__EUCALYN_TEST__.getAdaptiveMenu();
        const counts = menu.sources.reduce((result, source) => ({ ...result, [source]: (result[source] || 0) + 1 }), {});
        equal(menu.weakKeys.length, 3, "集中する弱点キー数");
        equal(counts.weak, 12, "弱点課題数");
        equal(counts.current, 5, "現在段階の課題数");
        equal(counts.review, 3, "復習課題数");
      });

      test("完了した5分セッションの成績を保存する", async () => {
        let app = await loadApp(1280, 800, "session-persistence");
        app.win.localStorage.removeItem(app.win.__EUCALYN_TEST__.getProgressSummary().storageKey);
        app = await loadApp(1280, 800, "session-persistence");
        app.doc.querySelector("#sessionStart").click();
        app.win.__EUCALYN_TEST__.advanceSession(300001);
        let summary = app.win.__EUCALYN_TEST__.getProgressSummary();
        equal(summary.sessions.length, 1, "保存前のセッション数");
        equal(summary.sessions[0].status, "completed", "セッション状態");

        app = await loadApp(1280, 800, "session-persistence");
        summary = app.win.__EUCALYN_TEST__.getProgressSummary();
        equal(summary.sessions.length, 1, "再読み込み後のセッション数");
        equal(summary.sessions[0].durationMs, 300000, "保存されたセッション時間");
      });

      test("ガイドを自動・常時・非表示から選び保存する", async () => {
        let app = await loadApp(1280, 800, "guide-setting");
        app.win.__EUCALYN_TEST__.seedKeyMastery();
        press(app.win, " ");
        equal(activeKey(app.doc), undefined, "自動設定で習得済みキーを隠す");
        equal(app.doc.querySelector("#fingerName").textContent, "習得済み", "習得済み表示");

        app.win.__EUCALYN_TEST__.setGuideMode("always");
        equal(activeKey(app.doc), "A", "常時表示の案内キー");
        app = await loadApp(1280, 800, "guide-setting");
        equal(app.win.__EUCALYN_TEST__.getProgressSummary().guideMode, "always", "再読み込み後の設定");
        app.win.__EUCALYN_TEST__.setGuideMode("off");
        equal(activeKey(app.doc), undefined, "非表示設定");
      });

      test("自動ガイドは習得後に隠れ、直近10回で2回誤ると戻る", async () => {
        const { win, doc } = await loadApp();
        win.__EUCALYN_TEST__.seedKeyMastery();
        press(win, " ");
        equal(activeKey(doc), undefined, "習得後の自動非表示");
        press(win, "q");
        await new Promise(resolve => setTimeout(resolve, 220));
        equal(activeKey(doc), undefined, "1回の誤入力では非表示を維持");
        press(win, "q");
        await new Promise(resolve => setTimeout(resolve, 220));
        equal(activeKey(doc), "A", "2回の誤入力後のガイド復帰");
      });

      test("進捗画面に習得数・弱点数・自己ベスト・次の小目標を表示する", async () => {
        const { win, doc } = await loadApp();
        win.__EUCALYN_TEST__.seedKeyMastery();
        win.__EUCALYN_TEST__.seedAttempts(Array.from({ length: 3 }, () => ({ expected: "A", typed: "Q", correct: false })));
        win.__EUCALYN_TEST__.seedSessions([{ status: "completed", correct: 42, accuracy: .96, durationMs: 300000 }]);
        doc.querySelector("#openProgress").click();
        assert(doc.querySelector("#progressDialog").open, "進捗画面が開いていません");
        equal(doc.querySelector("#masteredCount").textContent, "5個", "習得キー数");
        equal(doc.querySelector("#weakKeyCount").textContent, "1個", "重点練習キー数");
        equal(doc.querySelector("#personalBest").textContent, "42文字", "自己ベスト");
        assert(doc.querySelector("#nextGoal").textContent.includes("AとQ"), "混同に応じた小目標がありません");
      });

      test("5分完了時に事実に基づく成長メッセージと小目標を示す", async () => {
        const { win, doc } = await loadApp();
        doc.querySelector("#sessionStart").click();
        win.__EUCALYN_TEST__.advanceSession(300001);
        const message = doc.querySelector("#completeMessage").textContent;
        assert(message.includes("記録を一つ積み重ねました"), "実績のない成長を作らないメッセージではありません");
        equal((message.match(/次の小目標：/g) || []).length, 1, "小目標の数");
        assert(!message.includes("連続記録が途切れ"), "罰する表現が含まれています");
      });

      test("進捗をJSONで保存・削除・復元できる", async () => {
        const { win } = await loadApp();
        win.__EUCALYN_TEST__.seedAttempts([{ expected: "A", typed: "Q", correct: false }]);
        win.__EUCALYN_TEST__.setGuideMode("always");
        const json = win.__EUCALYN_TEST__.exportProgressJson();
        const exported = JSON.parse(json);
        equal(exported.version, 1, "JSONバージョン");
        equal(exported.attempts.length, 1, "保存した入力履歴数");

        win.__EUCALYN_TEST__.clearAllProgress();
        equal(win.__EUCALYN_TEST__.getProgressSummary().attemptCount, 0, "削除後の入力履歴数");
        equal(win.__EUCALYN_TEST__.getProgressSummary().guideMode, "auto", "削除後のガイド設定");
        win.__EUCALYN_TEST__.importProgressJson(json);
        equal(win.__EUCALYN_TEST__.getProgressSummary().attemptCount, 1, "復元後の入力履歴数");
        equal(win.__EUCALYN_TEST__.getProgressSummary().guideMode, "always", "復元後のガイド設定");
      });

      test("不正なJSONは既存の進捗を変更せず拒否する", async () => {
        const { win } = await loadApp();
        win.__EUCALYN_TEST__.seedAttempts([{ expected: "A", typed: "A", correct: true }]);
        for (const invalid of ["{", JSON.stringify({ version: 99, attempts: [], sessions: [], completedWords: [], keyAttempts: {} })]) {
          let rejected = false;
          try { win.__EUCALYN_TEST__.importProgressJson(invalid); } catch (_) { rejected = true; }
          assert(rejected, "不正なJSONを受け入れました");
          equal(win.__EUCALYN_TEST__.getProgressSummary().attemptCount, 1, "拒否後の入力履歴数");
        }
      });

      test("実務練習をいつでも手動選択でき、実務文とWPMを表示する", async () => {
        const { win, doc } = await loadApp();
        selectCourse(doc, "business");
        assert(!doc.querySelector("#wpmStat").hidden, "実務練習でWPMが表示されていません");
        press(win, " ");
        equal(doc.querySelector("#jpText").textContent, "ご確認をお願いします。", "最初の実務文");
        equal(doc.querySelector("#romajiText").textContent, "GOKAKUNINWOONEGAISIMASU.", "実務文のローマ字");
      });

      test("最低限の実務目安を15 WPM・正確率95%で判定する", async () => {
        const { win } = await loadApp();
        win.__EUCALYN_TEST__.seedSessions([
          { status: "completed", stage: "sentences", correct: 375, accuracy: .95, durationMs: 300000 },
          { status: "completed", stage: "sentences", correct: 374, accuracy: 1, durationMs: 300000 },
          { status: "completed", stage: "sentences", correct: 400, accuracy: .949, durationMs: 300000 }
        ]);
        const readiness = win.__EUCALYN_TEST__.getProgressSummary().readiness;
        equal(readiness.count, 1, "目安を満たした回数");
        assert(!readiness.achieved, "条件未達の記録まで到達扱いになっています");
      });

      test("実務目安を3回記録するとおすすめが実務練習へ進む", async () => {
        const { win, doc } = await loadApp();
        win.__EUCALYN_TEST__.seedKeyMastery();
        win.__EUCALYN_TEST__.seedCompletedWords();
        win.__EUCALYN_TEST__.seedSessions(Array.from({ length: 3 }, () => ({

      async function runAll() {
        const list = document.querySelector("#results");
        for (const item of TESTS) {
          try {
            await item.run();
            results.push({ name: item.name, status: "pass" });
          } catch (error) {
            results.push({ name: item.name, status: "fail", error: error.message });
          }
          const result = results.at(-1);
          const row = document.createElement("li");
          row.className = result.status;
          row.append(document.createTextNode(result.name));
          if (result.error) {
            const detail = document.createElement("small");
            detail.textContent = result.error;
            row.append(detail);
          }
          list.append(row);
        }

        const passed = results.filter(result => result.status === "pass").length;
        const failed = results.length - passed;
        const summary = document.querySelector("#summary");
        summary.textContent = `${results.length}件中 ${passed}件成功、${failed}件失敗`;
        summary.className = failed ? "fail" : "pass";
        summary.dataset.total = String(results.length);
        summary.dataset.passed = String(passed);
        summary.dataset.failed = String(failed);
        document.body.dataset.testComplete = "true";
        console.log("EUCALYN_TEST_RESULT", JSON.stringify({ total: results.length, passed, failed, results }));
      }

      runAll();
    })();
  </script>
