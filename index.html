+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e9ad1271-a803-4258-8164-a1d636c08e59\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a9415c89-d866-475a-b261-4ea5686fee31\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c452906c-8452-43b1-a376-044d959b3cd1\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f03a96d8-f41d-4006-bfdc-3f4bb38e13b3\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6d39fe4d-1b7d-4d26-bf9b-920c7d1fe825\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0eaf8f53-d228-42c3-b8d6-67ee6a43f885\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e9ad1271-a803-4258-8164-a1d636c08e59\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"a50744df-3191-4bf7-9e39-0fb4d0d227d6\"><\u002Fscript>\n\n<style>\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }\n  a { color: var(--color-accent-700); text-decoration: none; border-bottom: 1px solid var(--color-accent-300); }\n  a:hover { color: var(--color-accent-600); border-bottom-color: var(--color-accent-600); }\n  ::selection { background: var(--color-accent-200); }\n  button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-width: 1024px; padding: 40px 40px 80px\">\n  <div style=\"max-width: 1240px; margin: 0 auto\">\n\n    <header style=\"display: flex; flex-direction: column; gap: 15px\">\n      <div style=\"font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--color-accent-700)\">Logical layout drills — cost-performance model<\u002Fdiv>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 92px; line-height: .98; letter-spacing: -.02em; max-width: 22ch; text-wrap: pretty\">ちょうどいい、<br>自分サイズの新配列。<\u002Fp>\n      <h1 style=\"margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: 0\">Eucalyn配列コスパモデル<\u002Fh1>\n      <div style=\"height: 6px; background: var(--color-text)\"><\u002Fdiv>\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 30px; padding-bottom: 10px\">\n        <div style=\"font-size: 15px; color: var(--color-neutral-700); max-width: 62ch; text-wrap: pretty\">刻印を変えずに、打鍵と出力の対応表だけを差し替える練習台。QWERTYのままでも、OS側で配列を適用済みでも、同じ課題を打てます。<span style=\"color: var(--color-neutral-600)\">A trainer for the Eucalyn cost-performance model — usable with or without an OS-side remap.<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-neutral-600); white-space: nowrap\">Practice / Concept / Layout<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height: 1px; background: var(--color-text)\"><\u002Fdiv>\n    <\u002Fheader>\n\n    <section style=\"margin-top: 40px; display: flex; flex-direction: column; gap: 30px\">\n\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600)\">入力モード / Input mode<\u002Fdiv>\n          <div style=\"display: flex; gap: 5px\">\n            <button type=\"button\" class=\"btn {{ mQwertyCls }}\" sc-camel-on-click=\"{{ modeQwerty }}\" style=\"flex: 0 0 auto; white-space: nowrap\">QWERTYのまま · site-side<\u002Fbutton>\n            <button type=\"button\" class=\"btn {{ mLayoutCls }}\" sc-camel-on-click=\"{{ modeLayout }}\" style=\"flex: 0 0 auto; white-space: nowrap\">配列を適用済み · OS remap<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600)\">課題 / Course<\u002Fdiv>\n          <div style=\"display: flex; gap: 5px; flex-wrap: wrap\">\n            <sc-for list=\"{{ courseBtns }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <button type=\"button\" class=\"btn {{ c.cls }}\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"flex: 0 0 auto; white-space: nowrap\">{{ c.ja }} · {{ c.en }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600)\">打鍵音 / Key sound<\u002Fdiv>\n          <div style=\"display: flex; gap: 5px\">\n            <button type=\"button\" class=\"btn {{ soundOnCls }}\" sc-camel-on-click=\"{{ soundOn }}\" style=\"flex: 0 0 auto; white-space: nowrap\">ON<\u002Fbutton>\n            <button type=\"button\" class=\"btn {{ soundOffCls }}\" sc-camel-on-click=\"{{ soundOff }}\" style=\"flex: 0 0 auto; white-space: nowrap\">OFF<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: baseline; gap: 30px; padding-bottom: 12px; border-bottom: 2px solid var(--color-text)\">\n        <div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: var(--font-heading); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums\">{{ wpm }}<\u002Fspan><span style=\"font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600)\">wpm<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: var(--font-heading); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: {{ accInk }}\">{{ acc }}<\u002Fspan><span style=\"font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600)\">% 正確率 / accuracy<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: var(--font-heading); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums\">{{ elapsed }}<\u002Fspan><span style=\"font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600)\">sec<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-left: auto; display: flex; align-items: center; gap: 20px\">\n          <div style=\"font-size: 13px; color: var(--color-neutral-700)\">目安 15 WPM / 95% <span style=\"color: var(--color-neutral-500)\">· 自己ベスト {{ best }} WPM<\u002Fspan><\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ reset }}\" style=\"flex: 0 0 auto; white-space: nowrap\">やり直す · Reset (Esc)<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 40px; align-items: flex-start; flex-direction: column\">\n        <div style=\"flex: 1 1 0; min-width: 0\">\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 14px\">{{ courseLabel }} — {{ itemNo }}<\u002Fdiv>\n          <sc-if value=\"{{ hasJa }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin: 0 0 18px; font-family: var(--font-heading); font-weight: 600; font-size: 64px; line-height: 1.3; letter-spacing: .01em; text-wrap: pretty\">{{ jaText }}<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"font-family: var(--font-heading); font-weight: 400; font-size: 40px; line-height: 1.4; letter-spacing: .02em; word-break: break-all; color: var(--color-neutral-700)\">\n            <sc-for list=\"{{ chars }}\" as=\"c\" hint-placeholder-count=\"24\">\n              <span style=\"color: {{ c.ink }}; background: {{ c.bg }}; border-bottom: 2px solid {{ c.ul }}\">{{ c.ch }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 22px; display: flex; align-items: center; gap: 14px\">\n            <div style=\"height: 3px; flex: 1 1 auto; background: var(--color-neutral-300); position: relative; overflow: hidden\"><div style=\"position: absolute; inset: 0 auto 0 0; width: {{ progress }}; background: var(--color-accent)\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--color-neutral-600); white-space: nowrap\">{{ itemNo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 18px; font-size: 14px; color: var(--color-neutral-700)\">{{ hintText }}<\u002Fdiv>\n          <sc-if value=\"{{ finished }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: 26px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start\">\n              <div style=\"font-family: var(--font-heading); font-size: 28px; font-weight: 600\">課題を1周しました <span style=\"font-weight: 400; color: var(--color-neutral-600)\">/ course complete<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size: 17px; line-height: 1.7\">{{ resultLine }}<\u002Fdiv>\n              <div style=\"font-size: 15px; line-height: 1.65; color: var(--color-accent-700)\">{{ nextHint }}<\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ nextCourse }}\" style=\"flex: 0 0 auto; white-space: nowrap\">次の課題へ · Enter<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ again }}\" style=\"flex: 0 0 auto; white-space: nowrap\">同じ課題をもう一度<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px\">\n            <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600)\">次の打鍵 / Next key<\u002Fdiv>\n            <div style=\"font-size: 14px; color: var(--color-accent-700)\">{{ fingerJa }} · {{ fingerEn }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"display: flex; gap: 6px\">\n              <sc-for list=\"{{ rowA }}\" as=\"k\" hint-placeholder-count=\"10\">\n                <div style=\"width: 54px; height: 54px; border-radius: var(--radius-md); background: {{ k.bg }}; color: {{ k.ink }}; box-shadow: inset 0 0 0 1px {{ k.brd }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n                  <span style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 600; line-height: 1\">{{ k.legend }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; padding-left: 20px\">\n              <sc-for list=\"{{ rowB }}\" as=\"k\" hint-placeholder-count=\"10\">\n                <div style=\"width: 54px; height: 54px; border-radius: var(--radius-md); background: {{ k.bg }}; color: {{ k.ink }}; box-shadow: inset 0 0 0 1px {{ k.brd }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n                  <span style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 600; line-height: 1\">{{ k.legend }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; padding-left: 50px\">\n              <sc-for list=\"{{ rowC }}\" as=\"k\" hint-placeholder-count=\"10\">\n                <div style=\"width: 54px; height: 54px; border-radius: var(--radius-md); background: {{ k.bg }}; color: {{ k.ink }}; box-shadow: inset 0 0 0 1px {{ k.brd }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px\">\n                  <span style=\"font-family: var(--font-heading); font-size: 20px; font-weight: 600; line-height: 1\">{{ k.legend }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--color-neutral-600); max-width: 52ch\">図はコスパモデルの出力。塗られたキーが次に押す物理位置です。<span style=\"color: var(--color-neutral-500)\">Glyphs are the model's output; the filled key is the physical position to press.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"margin-top: 90px; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 60px; align-items: start\">\n      <div style=\"display: flex; flex-direction: column; gap: 30px\">\n        <div>\n          <h2 style=\"margin: 0 0 6px; font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1.1\">Eucalyn配列コスパモデルとは<\u002Fh2>\n          <div style=\"font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700)\">What the cost-performance model is<\u002Fdiv>\n          <p style=\"margin: 15px 0 0; font-size: 17px; line-height: 1.7; text-wrap: pretty\">Eucalyn配列をベースにしたアレンジである。移行コストを抑えることを第一に置き、その範囲内で日本語のローマ字入力をより打ちやすくした。<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-size: 17px; line-height: 1.7; text-wrap: pretty\">変えなくてよいキーは変えない。Vimのカーソル移動H・J・K・Lを成立させる。QWERTYと同位置のキーを多く残し、既存のショートカットをできるだけそのまま使えるようにする。結果としてアルファベット26キーのうち11キーがQWERTYと同位置に残り、一致率は42%になった。<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-size: 17px; line-height: 1.7; text-wrap: pretty\">効率を突き詰めた配列は他にもある。このモデルは効率をやや譲る代わりに、移行の手間と移行後の負担を小さくする方を選んでいる。<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"margin: 0 0 6px; font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1.1\">設計要件<\u002Fh2>\n          <div style=\"font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700)\">Design constraints<\u002Fdiv>\n          <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 20px\">\n            <div style=\"display: flex; gap: 20px; align-items: baseline\">\n              <div style=\"font-family: var(--font-heading); font-size: 40px; font-weight: 600; line-height: .9; color: var(--color-accent); flex: 0 0 auto; font-variant-numeric: tabular-nums\">01<\u002Fdiv>\n              <div><div style=\"font-size: 18px; font-weight: 600\">移行コストの最小化<\u002Fdiv><div style=\"font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600); margin-top: 3px\">Minimal migration cost<\u002Fdiv><p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.65; color: var(--color-neutral-800)\">変更キー数を抑え、既存のショートカットと指の身体記憶を可能な限り保持する。変えなくてよいキーは変えない。<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 20px; align-items: baseline\">\n              <div style=\"font-family: var(--font-heading); font-size: 40px; font-weight: 600; line-height: .9; color: var(--color-accent); flex: 0 0 auto; font-variant-numeric: tabular-nums\">02<\u002Fdiv>\n              <div><div style=\"font-size: 18px; font-weight: 600\">Vim互換の維持<\u002Fdiv><div style=\"font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600); margin-top: 3px\">Vim compatibility<\u002Fdiv><p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.65; color: var(--color-neutral-800)\">H・J・K・Lをカーソル移動として成立させ、保存・終了に使うW・Qを原位置に残す。Vim運用を捨てないことが前提条件。<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 20px; align-items: baseline\">\n              <div style=\"font-family: var(--font-heading); font-size: 40px; font-weight: 600; line-height: .9; color: var(--color-accent); flex: 0 0 auto; font-variant-numeric: tabular-nums\">03<\u002Fdiv>\n              <div><div style=\"font-size: 18px; font-weight: 600\">均衡した効率化<\u002Fdiv><div style=\"font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600); margin-top: 3px\">Balanced efficiency<\u002Fdiv><p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.65; color: var(--color-neutral-800)\">最高効率ではなく、上の2条件の範囲内で中段集中・同指連続の回避・指ごとの負荷分散を最大化する。<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"margin: 0 0 6px; font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1.1\">キー配置の考え方<\u002Fh2>\n          <div style=\"font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700)\">How the keys are placed<\u002Fdiv>\n          <div style=\"margin-top: 20px; font-size: 18px; font-weight: 600\">母音 — 左手<span style=\"font-weight: 400; color: var(--color-neutral-600)\"> / vowels<\u002Fspan><\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.7; text-wrap: pretty\">母音は左手に集約する。Eucalyn配列は5母音を中段に横並びさせるが、本モデルは人差し指の負荷を分散するためEを1段上げた凸型とし、中指にU・Eの2母音を持たせた。母音のうち負担の小さいU・Eを選んでいるため、左手の負荷が分散している。打鍵頻度が最大のAは、QWERTYと同じ左小指ホームに残した。大西配列はAを中指に、頻度の低いEを小指に置く最適化を採り、効率の面でより踏み込んだ解になっている。本モデルはそこを取らず、移行時の感覚のずれ、とくに左手母音のミスタイプを抑える側に振った。またこれにより使用頻度の高いショートカットの全選択（cntl＋A）を残している。<\u002Fp>\n          <div style=\"margin-top: 24px; font-size: 18px; font-weight: 600\">子音と運指 — 右手<span style=\"font-weight: 400; color: var(--color-neutral-600)\"> / consonants<\u002Fspan><\u002Fdiv>\n          <p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.7; text-wrap: pretty\">打鍵数の多い子音は右手に集約する。Eucalyn配列に対してDとRを入れ替え、打鍵頻度の高いRを人差し指から中指へ移し、人差し指の過負荷を軽減している。Yは頻度自体が低いため、QWERTYの位置に残す選択もあり得たが、拗音（きゃ・しゃ等）で連接する子音の近傍へ移している。GとMは効率上わずかにMが中段、Gが下段である方が良いが、QWERTYで下段にあるMを中段に移動すると感覚のズレが発生する。この違和感を抑えるため、Mは下段へ残し指の動きの流れを変えないことを優先した。Vimの利用を前提としており、移動キーのhkjlを逆T字で配置、またVimで使用頻度が高いショートカットの「QW」キーをそのまま残している。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <aside style=\"display: flex; flex-direction: column; gap: 40px\">\n        <div>\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 12px\">QWERTY一致率 / Overlap with QWERTY<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider)\"><span style=\"font-size: 16px\">大西配列<\u002Fspan><span style=\"font-size: 15px; color: var(--color-neutral-700); font-variant-numeric: tabular-nums\">6 / 26 · 23%<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider)\"><span style=\"font-size: 16px\">Eucalyn配列<\u002Fspan><span style=\"font-size: 15px; color: var(--color-neutral-700); font-variant-numeric: tabular-nums\">9 / 26 · 34%<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 2px solid var(--color-text)\"><span style=\"font-size: 16px; font-weight: 600\">コスパモデル<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: var(--color-accent-2-700); font-variant-numeric: tabular-nums\">11 / 26 · 42%<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: var(--color-neutral-700)\">一致率が高いほどショートカットの再設定量と学習コストが小さい。効率スコアとはトレードオフの関係にある。<span style=\"color: var(--color-neutral-600)\">Higher overlap means lower migration cost, traded against efficiency.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 12px\">出典 / Sources<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.6; color: var(--color-neutral-800)\">\n            <div>Eucalyn配列コスパモデル<br><a href=\"https://note.com/hyu_nisworks/n/n98e034b02379\" target=\"_blank\" rel=\"noopener\">論理配列の沼へ｜note<\u002Fa><\u002Fdiv>\n            <div>Eucalyn配列<br><a href=\"https://eucalyn.hatenadiary.jp/entry/about-eucalyn-layout\" target=\"_blank\" rel=\"noopener\">ゆかりメモ Eucalyn配列について<\u002Fa><\u002Fdiv>\n            <div>大西配列<br><a href=\"https://o24.works/layout/\" target=\"_blank\" rel=\"noopener\">大西配列｜ローマ字をもっと打ちやすく<\u002Fa><\u002Fdiv>\n            <div>配列の評価に用いた計測<br><a href=\"https://patorjk.com/keyboard-layout-analyzer/\" target=\"_blank\" rel=\"noopener\">Keyboard Layout Analyzer<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fsection>\n\n    <section style=\"margin-top: 90px\">\n      <h2 style=\"margin: 0 0 6px; font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1.1\">打鍵の分布<\u002Fh2>\n      <div style=\"font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700)\">Key-press distribution — Japanese romaji input<\u002Fdiv>\n      <p style=\"margin: 15px 0 0; font-size: 17px; line-height: 1.7; max-width: 62ch; text-wrap: pretty\">日本語ローマ字入力での打鍵をキーごとに集計したヒートマップ。QWERTYでは指のホームポジションがある中段があまり使われず、上段・下段への移動が多い。コスパモデルでは母音と主要な子音が中段に集まり、移動距離が短くなる。また左手に打鍵頻度が高いが数が少ない母音を集め、右手に数が多い子音を固めることで、左右の負荷を分散させる設計は、Eucalyn配列や大西配列と同じである。<\u002Fp>\n      <div style=\"margin-top: 30px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px\">\n        <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n          <img src=\"4e19e5c2-8359-4fd4-9f26-2e6729622148\" alt=\"QWERTY配列における日本語ローマ字入力の打鍵ヒートマップ\" style=\"width: 100%; height: auto; display: block; border-radius: var(--radius-md)\">\n          <figcaption style=\"font-size: 14px; color: var(--color-neutral-700)\"><span style=\"font-weight: 600; color: var(--color-text)\">QWERTY配列<\u002Fspan> — 中段の使用が少ない<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n          <img src=\"21e7d1a5-9392-4d93-b2f8-524d34726289\" alt=\"Eucalyn配列コスパモデルにおける日本語ローマ字入力の打鍵ヒートマップ\" style=\"width: 100%; height: auto; display: block; border-radius: var(--radius-md)\">\n          <figcaption style=\"font-size: 14px; color: var(--color-neutral-700)\"><span style=\"font-weight: 600; color: var(--color-text)\">Eucalyn配列コスパモデル<\u002Fspan> — 中段に集中する<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n      <div style=\"margin-top: 50px\">\n        <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 16px\">効率スコア / Efficiency score<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 50px\">\n          <div>\n            <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px\">日本語ローマ字 <span style=\"font-weight: 400; color: var(--color-neutral-600)\">Japanese romaji<\u002Fspan><\u002Fdiv>\n            <sc-raw-table class=\"table\" style=\"width: 100%\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 3.5em\">順位<\u002Fsc-raw-th><sc-raw-th>配列<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right\">スコア<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>大西配列<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums\">75.58<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td style=\"font-weight: 600\">Eucalyn配列コスパモデル<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-weight: 600; color: var(--color-accent-2-700); font-variant-numeric: tabular-nums\">71.13<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Eucalyn配列<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums\">66.06<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>QWERTY配列<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums\">46.64<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px\">英文 <span style=\"font-weight: 400; color: var(--color-neutral-600)\">English text<\u002Fspan><\u002Fdiv>\n            <sc-raw-table class=\"table\" style=\"width: 100%\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 3.5em\">順位<\u002Fsc-raw-th><sc-raw-th>配列<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right\">スコア<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>大西配列<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums\">63.31<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td style=\"font-weight: 600\">Eucalyn配列コスパモデル<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-weight: 600; color: var(--color-accent-2-700); font-variant-numeric: tabular-nums\">55.19<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Eucalyn配列<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums\">54.47<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>QWERTY配列<\u002Fsc-raw-td><sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums\">49.59<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 20px 0 0; font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); max-width: 74ch\">スコアは運指距離・同指連打・指ごとの負荷などから算出される総合値で、高いほど効率が良い。効率を突き詰めた大西配列が上位に立つ。コスパモデルはベースのEucalyn配列を上回りつつ、QWERTYとの一致率も高い位置にある。ローマ字入力を目的とした配列のため英文のスコアは伸びないが、QWERTYよりは上回る。<\u002Fp>\n        <p style=\"margin: 14px 0 0; font-size: 14px; color: var(--color-neutral-600)\">計測 / measured with <a href=\"https://patorjk.com/keyboard-layout-analyzer/\" target=\"_blank\" rel=\"noopener\">Keyboard Layout Analyzer<\u002Fa>。文字量が限られた参考値です。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"margin-top: 90px\">\n      <h2 style=\"margin: 0 0 6px; font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1.1\">配列図<\u002Fh2>\n      <div style=\"font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700)\">The layout, and what it keeps from QWERTY<\u002Fdiv>\n      <div style=\"margin-top: 26px; display: flex; gap: 60px; align-items: flex-start; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; gap: 8px\">\n            <sc-for list=\"{{ refA }}\" as=\"k\" hint-placeholder-count=\"10\">\n              <div style=\"width: 72px; height: 72px; border-radius: var(--radius-md); background: {{ k.bg }}; color: {{ k.ink }}; box-shadow: inset 0 0 0 1px {{ k.brd }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px\">\n                <span style=\"font-family: var(--font-heading); font-size: 26px; font-weight: 600; line-height: 1\">{{ k.legend }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; padding-left: 26px\">\n            <sc-for list=\"{{ refB }}\" as=\"k\" hint-placeholder-count=\"10\">\n              <div style=\"width: 72px; height: 72px; border-radius: var(--radius-md); background: {{ k.bg }}; color: {{ k.ink }}; box-shadow: inset 0 0 0 1px {{ k.brd }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px\">\n                <span style=\"font-family: var(--font-heading); font-size: 26px; font-weight: 600; line-height: 1\">{{ k.legend }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; padding-left: 66px\">\n            <sc-for list=\"{{ refC }}\" as=\"k\" hint-placeholder-count=\"10\">\n              <div style=\"width: 72px; height: 72px; border-radius: var(--radius-md); background: {{ k.bg }}; color: {{ k.ink }}; box-shadow: inset 0 0 0 1px {{ k.brd }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px\">\n                <span style=\"font-family: var(--font-heading); font-size: 26px; font-weight: 600; line-height: 1\">{{ k.legend }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 34ch\">\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--color-neutral-600)\">凡例 / Legend<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px\">\n            <div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 16px; height: 16px; border-radius: var(--radius-sm); background: var(--color-accent-2-200); box-shadow: inset 0 0 0 1px var(--color-accent-2-400)\"><\u002Fspan><span style=\"font-size: 14px\">QWERTYと同位置<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px\">\n            <div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 16px; height: 16px; border-radius: var(--radius-sm); background: var(--color-accent-100); box-shadow: inset 0 0 0 1px var(--color-accent-300)\"><\u002Fspan><span style=\"font-size: 14px\">Vim移動キー H J K L<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px\">\n            <div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 16px; height: 16px; border-radius: var(--radius-sm); background: var(--color-neutral-100); box-shadow: inset 0 0 0 1px var(--color-neutral-300)\"><\u002Fspan><span style=\"font-size: 14px\">変更されたキー<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"margin-top: 90px; padding-top: 20px; border-top: 1px solid var(--color-text); display: flex; justify-content: space-between; align-items: baseline; gap: 30px\">\n      <div style=\"font-size: 13px; color: var(--color-neutral-600)\">パソコン専用 / desktop only · 入力履歴はブラウザー内にのみ保存されます<\u002Fdiv>\n      <div style=\"font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600)\">Eucalyn Trainer<\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\n\nconst QMAP = {\n  q:'q', w:'w', e:'e', r:',', t:'.', y:'f', u:'d', i:'r', o:'y', p:'p',\n  a:'a', s:'i', d:'u', f:'o', g:'-', h:'g', j:'t', k:'k', l:'s', ';':'n', \"'\":\"'\",\n  z:'z', x:'x', c:'c', v:'v', b:'b', n:'m', m:'h', ',':'j', '.':'l', '/':'/',\n  '-':';', '=':'='\n};\nconst INV = {};\nObject.keys(QMAP).forEach(k => { INV[QMAP[k]] = k; });\n\nconst FING = [1, 2, 3, 4, 4, 7, 7, 8, 9, 10];\nconst FJA = { 1:'左小指', 2:'左薬指', 3:'左中指', 4:'左人差し指', 7:'右人差し指', 8:'右中指', 9:'右薬指', 10:'右小指' };\nconst FEN = { 1:'L pinky', 2:'L ring', 3:'L middle', 4:'L index', 7:'R index', 8:'R middle', 9:'R ring', 10:'R pinky' };\nconst ROWS = ['qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'];\nconst VIM = ['h', 'j', 'k', 'l'];\n\nconst COURSES = [\n  { ja:'キー探索', en:'Key hunt',\n    items:['aiuo aiuo', 'gtks gtks', 'aiuo gtksn', 'ai ue oi ka ki', 'na ni nu ne no'],\n    jaItems:['あいうお あいうお', '', '', 'あい うえ おい か き', 'な に ぬ ね の'] },\n  { ja:'短いワード', en:'Short words',\n    items:['aki kaki tsuki', 'hana mizu sora', 'kaze yuki neko', 'tokei isu tsukue', 'shashin kyaku'],\n    jaItems:['秋 柿 月', '花 水 空', '風 雪 猫', '時計 椅子 机', '写真 客'] },\n  { ja:'例文', en:'Sentences',\n    items:['kyou wa kaze ga tsuyoi node mado wo shimeta', 'atarashii hairetsu no renshuu wo tsuzukeru', 'shiyou hindo no takai moji wo chuudan ni oku'],\n    jaItems:['今日は風が強いので窓を閉めた', '新しい配列の練習を続ける', '使用頻度の高い文字を中段に置く'] },\n  { ja:'実務練習', en:'Working text',\n    items:['hjkl de kaasoru wo idou suru', 'vim init.lua wo hensyuu shite hozon suru', 'shinchoku wa shuu ichi de kyouyuu shimasu'],\n    jaItems:['hjkl でカーソルを移動する', 'vim で init.lua を編集して保存する', '進捗は週一で共有します'] }\n];\nconst KEY = 'eucalyn-trainer-prefs-v1';\n\nconst ROMAJI_VARIANTS = [\n  ['sha', ['sha', 'sya']], ['shu', ['shu', 'syu']], ['sho', ['sho', 'syo']],\n  ['cha', ['cha', 'tya']], ['chu', ['chu', 'tyu']], ['cho', ['cho', 'tyo']],\n  ['shi', ['shi', 'si']], ['chi', ['chi', 'ti']], ['tsu', ['tsu', 'tu']],\n  ['fu', ['fu', 'hu']], ['ji', ['ji', 'zi']]\n];\n\nfunction romajiTargetPos(target, typed) {\n  let pos = -1;\n  function walk(ti, yi) {\n    if (yi === typed.length) { pos = ti; return true; }\n    if (ti >= target.length) return false;\n    for (const [canon, alts] of ROMAJI_VARIANTS) {\n      if (!target.startsWith(canon, ti)) continue;\n      for (const alt of alts) {\n        if (typed.startsWith(alt, yi) && walk(ti + canon.length, yi + alt.length)) return true;\n      }\n    }\n    if (target[ti] === typed[yi] && walk(ti + 1, yi + 1)) return true;\n    return false;\n  }\n  return walk(0, 0) ? pos : -1;\n}\n\nfunction romajiValidPrefix(target, typed) {\n  return romajiTargetPos(target, typed) >= 0;\n}\n\nfunction romajiComplete(target, typed) {\n  return romajiTargetPos(target, typed) === target.length;\n}\n\nconst KeySound = {\n  ctx: null,\n  ensure() {\n    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();\n    if (this.ctx.state === 'suspended') this.ctx.resume();\n    return this.ctx;\n  },\n  play(correct) {\n    try {\n      const ctx = this.ensure();\n      const t = ctx.currentTime;\n      const len = Math.floor(ctx.sampleRate * 0.035);\n      const buf = ctx.createBuffer(1, len, ctx.sampleRate);\n      const d = buf.getChannelData(0);\n      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.007));\n      const src = ctx.createBufferSource();\n      src.buffer = buf;\n      const f = ctx.createBiquadFilter();\n      f.type = 'bandpass';\n      f.frequency.value = correct ? 2600 : 800;\n      f.Q.value = 0.8;\n      const g = ctx.createGain();\n      g.gain.setValueAtTime(0.28, t);\n      g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);\n      src.connect(f).connect(g).connect(ctx.destination);\n      src.start(t);\n    } catch (e) {}\n  },\n  complete() {\n    try {\n      const ctx = this.ensure();\n      const t = ctx.currentTime;\n      [440, 660].forEach((freq, i) => {\n        const osc = ctx.createOscillator();\n        const g = ctx.createGain();\n        osc.type = 'triangle';\n        osc.frequency.value = freq;\n        const start = t + i * 0.1;\n        g.gain.setValueAtTime(0.0001, start);\n        g.gain.exponentialRampToValueAtTime(0.16, start + 0.012);\n        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);\n        osc.connect(g).connect(ctx.destination);\n        osc.start(start);\n        osc.stop(start + 0.17);\n      });\n    } catch (e) {}\n  }\n};\n\nclass Component extends DCLogic {\n  state = { mode:'qwerty', variant:'headline', course:0, item:0, typed:'', correct:0, typedTotal:0, start:null, now:0, best:0, finished:false, sound:true };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const p = JSON.parse(raw);\n        this.setState({\n          mode: p.mode || 'qwerty',\n          variant: p.variant || 'headline',\n          best: p.best || 0,\n          sound: p.sound !== false,\n          course: typeof p.course === 'number' ? Math.min(Math.max(p.course, 0), COURSES.length - 1) : 0\n        });\n      }\n    } catch (e) {}\n    this.onKey = (e) => this.handleKey(e);\n    window.addEventListener('keydown', this.onKey);\n    this.timer = setInterval(() => { if (this.state.start && !this.state.finished) this.setState({ now: Date.now() }); }, 250);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this.onKey);\n    clearInterval(this.timer);\n  }\n\n  save(patch) {\n    const s = Object.assign({}, this.state, patch || {});\n    try { localStorage.setItem(KEY, JSON.stringify({ mode:s.mode, variant:s.variant, best:s.best, sound:s.sound !== false, course:s.course })); } catch (e) {}\n  }\n\n  finishStats() {\n    const s = this.state;\n    const elapsedMs = s.start ? Math.max(s.now - s.start, 250) : 0;\n    const wpm = elapsedMs ? Math.round((s.correct / 5) / (elapsedMs / 60000)) : 0;\n    const acc = s.typedTotal ? Math.round((s.correct / s.typedTotal) * 100) : 100;\n    let next = s.course;\n    let change = 'same';\n    if (acc >= 95 && wpm >= 15) {\n      next = Math.min(s.course + 1, COURSES.length - 1);\n      if (next > s.course) change = 'up';\n    } else if (acc < 85 || wpm < 8) {\n      next = Math.max(s.course - 1, 0);\n      if (next < s.course) change = 'down';\n    }\n    return { wpm, acc, next, change };\n  }\n\n  advanceAfterFinish = () => {\n    const { next } = this.finishStats();\n    this.setState({\n      course: next,\n      item: 0,\n      typed: '',\n      correct: 0,\n      typedTotal: 0,\n      start: null,\n      now: Date.now(),\n      finished: false\n    });\n    this.save({ course: next });\n  };\n\n  text() {\n    const c = COURSES[this.state.course];\n    return c.items[Math.min(this.state.item, c.items.length - 1)].replace(/ /g, '');\n  }\n\n  jaText() {\n    const c = COURSES[this.state.course];\n    const list = c.jaItems || [];\n    return list[Math.min(this.state.item, c.items.length - 1)] || '';\n  }\n\n  reset = () => this.setState({ typed:'', correct:0, typedTotal:0, start:null, now:0, item:0, finished:false });\n\n  again = () => this.reset();\n\n  nextCourse = () => this.advanceAfterFinish();\n\n  handleKey(e) {\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    if (e.key === 'Escape') { this.reset(); return; }\n    if (this.state.finished) {\n      if (e.key === 'Enter') {\n        e.preventDefault();\n        this.advanceAfterFinish();\n      }\n      return;\n    }\n    if (e.key === 'Backspace') {\n      e.preventDefault();\n      this.setState(s => ({ typed: s.typed.slice(0, -1) }));\n      return;\n    }\n    if (e.key === 'Tab' || e.key.length !== 1) return;\n    e.preventDefault();\n    let ch = e.key;\n    if (this.state.mode === 'qwerty') {\n      const low = ch.toLowerCase();\n      if (QMAP[low] !== undefined) ch = QMAP[low];\n    }\n    const target = this.text();\n    const trial = this.state.typed + ch;\n    const ok = romajiValidPrefix(target, trial);\n    const finishCourse = ok && romajiComplete(target, trial)\n      && this.state.item >= COURSES[this.state.course].items.length - 1;\n    if (this.state.sound) {\n      if (finishCourse) KeySound.complete();\n      else KeySound.play(ok);\n    }\n    if (!ok) {\n      this.setState(s => ({\n        typedTotal: s.typedTotal + 1,\n        start: s.start || Date.now(),\n        now: Date.now()\n      }));\n      return;\n    }\n    this.setState(s => {\n      const typed = trial;\n      const next = {\n        typed,\n        typedTotal: s.typedTotal + 1,\n        correct: s.correct + 1,\n        start: s.start || Date.now(),\n        now: Date.now()\n      };\n      if (romajiComplete(target, typed)) {\n        const last = COURSES[s.course].items.length - 1;\n        next.typed = '';\n        if (s.item >= last) { next.finished = true; next.item = last; }\n        else next.item = s.item + 1;\n        const mins = ((Date.now() - (s.start || Date.now())) / 60000) || 1 / 60000;\n        const wpm = Math.round((next.correct / 5) / mins);\n        if (isFinite(wpm) && wpm > s.best && wpm < 400) { next.best = wpm; this.save({ best: wpm }); }\n      }\n      return next;\n    });\n  }\n\n  keyRows(highlight, reference) {\n    return ROWS.map(row => row.split('').map((qw, i) => {\n      const legend = QMAP[qw];\n      const same = legend === qw;\n      const hot = highlight && qw === highlight;\n      let bg = 'var(--color-neutral-100)', ink = 'var(--color-text)', brd = 'var(--color-neutral-300)', sub = 'var(--color-neutral-500)';\n      if (reference && same) { bg = 'var(--color-accent-2-200)'; brd = 'var(--color-accent-2-400)'; sub = 'var(--color-accent-2-700)'; }\n      else if (reference && VIM.indexOf(legend) >= 0) { bg = 'var(--color-accent-100)'; brd = 'var(--color-accent-300)'; sub = 'var(--color-accent-700)'; }\n      if (hot) { bg = 'var(--color-accent)'; ink = '#ffffff'; brd = 'var(--color-accent-700)'; sub = 'rgba(255,255,255,.72)'; }\n      return { legend: legend === ' ' ? '' : legend, qw, bg, ink, brd, sub, finger: FING[i] };\n    }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const target = this.text();\n    const idx = Math.max(romajiTargetPos(target, s.typed), 0);\n    const cur = target[idx];\n    const phys = cur === ' ' ? ' ' : (INV[cur] || cur);\n\n    const chars = target.split('').map((ch, i) => {\n      let ink = 'var(--color-neutral-400)', bg = 'transparent', ul = 'transparent';\n      if (i < idx) {\n        ink = 'var(--color-neutral-600)';\n      } else if (i === idx) {\n        ink = 'var(--color-text)';\n        bg = 'var(--color-accent-200)';\n        ul = 'var(--color-accent)';\n      } else {\n        ink = 'var(--color-text)';\n      }\n      return { ch: ch === ' ' ? '\\u00a0' : ch, ink, bg, ul };\n    });\n\n    const elapsedMs = s.start ? Math.max(s.now - s.start, 250) : 0;\n    const secs = Math.round(elapsedMs / 1000);\n    const wpm = elapsedMs ? Math.round((s.correct / 5) / (elapsedMs / 60000)) : 0;\n    const acc = s.typedTotal ? Math.round((s.correct / s.typedTotal) * 100) : 100;\n\n    const rows = this.keyRows(phys === ' ' ? null : phys, false);\n    const refRows = this.keyRows(null, true);\n\n    const cls = (on) => on ? 'btn-primary' : 'btn-secondary';\n\n    let col = -1;\n    for (let r = 0; r < ROWS.length && col < 0; r++) col = ROWS[r].indexOf(phys);\n    const fingerNum = cur === ' ' ? 5 : (col >= 0 ? FING[col] : 0);\n    const fJa = cur === ' ' ? '親指' : (FJA[fingerNum] || '—');\n    const fEn = cur === ' ' ? 'thumb' : (FEN[fingerNum] || '');\n\n    const ja = this.jaText();\n    const finish = s.finished ? this.finishStats() : null;\n    const nextLabel = finish ? COURSES[finish.next].ja + ' — ' + COURSES[finish.next].en : '';\n    const nextHint = finish\n      ? (finish.change === 'up'\n        ? 'Enter → 「' + nextLabel + '」へ（15 WPM・正確率95%以上でレベルアップ）'\n        : finish.change === 'down'\n          ? 'Enter → 「' + nextLabel + '」へ復習（正確率85%未満または8 WPM未満）'\n          : 'Enter → 「' + nextLabel + '」を続ける（同じ難易度）')\n      : '';\n\n    return {\n      chars,\n      jaText: ja, hasJa: !!ja,\n      wpm, acc, best: s.best, elapsed: secs,\n      accInk: acc >= 95 ? 'var(--color-text)' : 'var(--color-accent-2-700)',\n      progress: s.finished ? '100%' : Math.round(((s.item + idx / Math.max(target.length, 1)) / COURSES[s.course].items.length) * 100) + '%',\n      itemNo: (s.finished ? COURSES[s.course].items.length : Math.min(s.item, COURSES[s.course].items.length - 1) + 1) + ' / ' + COURSES[s.course].items.length,\n      finished: s.finished,\n      nextHint,\n      again: this.again,\n      nextCourse: this.nextCourse,\n      resultLine: (wpm >= 15 && acc >= 95)\n        ? wpm + ' WPM / 正確率 ' + acc + '% — 目安（15 WPM・95%）に到達しています。'\n        : wpm + ' WPM / 正確率 ' + acc + '% — 目安は15 WPM・正確率95%です。',\n      courseLabel: COURSES[s.course].ja + ' — ' + COURSES[s.course].en,\n      hintText: s.mode === 'qwerty'\n        ? 'キーボードはQWERTYのまま。サイト側で変換します。図で塗られた位置のキーを押してください。 Keys are converted here — press the highlighted position.'\n        : 'OS側で配列を適用済みの前提。表示どおりに打鍵してください。 Type as printed — your remap is assumed.',\n      fingerJa: fJa, fingerEn: fEn,\n      rowA: rows[0], rowB: rows[1], rowC: rows[2],\n      refA: refRows[0], refB: refRows[1], refC: refRows[2],\n      mQwertyCls: cls(s.mode === 'qwerty'),\n      mLayoutCls: cls(s.mode === 'layout'),\n      modeQwerty: () => { this.setState({ mode:'qwerty' }); this.save({ mode:'qwerty' }); },\n      modeLayout: () => { this.setState({ mode:'layout' }); this.save({ mode:'layout' }); },\n      soundOnCls: cls(s.sound !== false),\n      soundOffCls: cls(s.sound === false),\n      soundOn: () => { this.setState({ sound:true }); this.save({ sound:true }); },\n      soundOff: () => { this.setState({ sound:false }); this.save({ sound:false }); },\n      reset: this.reset,\n      courseBtns: COURSES.map((c, i) => ({\n        ja: c.ja, en: c.en, cls: cls(i === s.course),\n        onClick: () => {\n          this.setState({ course:i, item:0, typed:'', correct:0, typedTotal:0, start:null, now:0, finished:false });\n          this.save({ course:i });\n        }\n      }))\n    };\n  }\n}\n\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
